# Fly.io Konfiguration – TrainConnect Europe
# Region: Frankfurt (nähe Schweiz)
# fly.io/docs/reference/configuration/

app = "trainconnect-europe"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  JWT_ALGORITHM = "HS256"
  JWT_EXPIRE_MIN = "10080"
  CORS_ORIGINS = "*"
  TRANSPORT_REST_BASE = "https://v6.db.transport.rest"
  VAPID_PUBLIC_KEY = "BBtqVXaeWnmt5FTRE1HhLwJB9SpPrYS-RwpSN1Z44b0umEcHLNIjlXVJdY-rYScyS7-nz-r-IyK1cdp_2a77UNk"
  VAPID_CONTACT = "mailto:admin@trainconnect.eu"

# JWT_SECRET wird als Secret gesetzt (fly secrets set JWT_SECRET=...)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"    # Kein Sleep – immer online
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Persistentes Volume für die JSON-Datenbank
[[mounts]]
  source = "trainconnect_data"
  destination = "/app/backend/data"
  initial_size = "1gb"
