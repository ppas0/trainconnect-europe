<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050914" />
  <meta name="description" content="TrainConnect Europe – Alle europäischen Zugverbindungen, Verspätungen und Live-Positionen auf einer Plattform. Ein Ticket. Ganz Europa." />

  <!-- PWA -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TrainConnect" />
  <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/icon-192.png" />

  <!-- Open Graph -->
  <meta property="og:title" content="TrainConnect Europe – Ein Ticket. Ganz Europa." />
  <meta property="og:description" content="Alle europäischen Zugverbindungen vergleichen, Live-Position des Zugs auf der Karte sehen und sofort buchen." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />

  <!-- Fonts: Cabinet Grotesk (headings) + IBM Plex Mono + Inter (body) -->
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,700,500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Leaflet CSS (JS via npm) with SRI -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />

  <title>TrainConnect Europe – Ein Ticket. Ganz Europa.</title>

  <script>
    window.addEventListener("error", function(e){
      if (e.error instanceof DOMException && e.error.name === "DataCloneError"
          && e.message && e.message.includes("PerformanceServerTiming")) {
        e.stopImmediatePropagation(); e.preventDefault();
      }
    }, true);
  </script>
</head>
<body>
  <noscript>Diese Anwendung benötigt JavaScript. Bitte aktiviere es in deinem Browser.</noscript>
  <div id="root"></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('%PUBLIC_URL%/sw.js').catch(function(){});
      });
    }
  </script>

</body>
</html>
