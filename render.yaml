services:
  - type: web
    name: trainconnect-europe
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MIN
        value: "10080"
      - key: CORS_ORIGINS
        value: "*"
      - key: TRANSPORT_REST_BASE
        value: https://v6.db.transport.rest
